<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siege!</title>
  <style>html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: absolute; background: #1a1423; z-index: 0; }</style>
  <!-- macroquad is not a wasm-bindgen app, so trunk's rust loader is not used
       (see Trunk.toml: inject_scripts = false + a post_build hook that stages
       the pristine cargo artifact as siege.wasm). mq_js_bundle.js is the
       miniquad shell + quad-snd plugin; it boots the wasm below. Every path
       is relative, so the page works at any base URL such as
       https://devfire.github.io/siege/. -->
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <link data-trunk rel="copy-file" href="mq_js_bundle.js" />
  <script src="mq_js_bundle.js"></script>
  <script>load("siege.wasm");</script>
</body>
</html>
